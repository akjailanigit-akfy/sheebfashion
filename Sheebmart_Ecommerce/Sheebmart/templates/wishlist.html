{% extends "base.html" %}
{% block title %}Wishlist | Sheebmart{% endblock %}
{% block content %}
<section class="container py-5">
    <div class="section-heading"><div><span class="eyebrow">SAVED FOR LATER</span><h1>Wishlist</h1></div></div>
    <div class="row g-4">
        {% for item in items %}
        <div class="col-6 col-md-4 col-lg-3">{% include "partials/product_card.html" with product=item.product %}</div>
        {% empty %}
        <div class="col-12"><div class="empty-state"><div class="empty-icon"><i class="fa-regular fa-heart"></i></div><h2>Your wishlist is empty</h2><a href="{% url 'products:collection' %}" class="btn btn-dark">Explore Products</a></div></div>
        {% endfor %}
    </div>
</section>
{% endblock %}
